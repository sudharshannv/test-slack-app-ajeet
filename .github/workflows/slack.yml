name: slack

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
    types: [opened]

jobs:
  call_slack_workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Call Slack Workflow webhook
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d '{
              "pr_url": "${{ github.event.pull_request.html_url }}",
              "pr_title": "${{ github.event.pull_request.title }}",
              "pr_body": "${{ github.event.pull_request.body || \"(no description)\" }}"
            }'
