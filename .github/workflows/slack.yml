name: slack

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
    types: [opened]

jobs:
  notify_slack:
    runs-on: ubuntu-latest
    env:
      WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Ensure webhook secret is set
        run: |
          if [ -z "${WEBHOOK:-}" ]; then
            echo "ERROR: SLACK_WEBHOOK_URL secret is not set."
            exit 1
          fi

      - name: Build payload and call webhook
        run: |
          # Build JSON safely (jq will escape the title correctly)
          jq -n \
            --arg url "$PR_URL" \
            --arg title "$PR_TITLE" \
            --arg number "$PR_NUMBER" \
            '{pr_url: $url, pr_title: $title, pr_number: $number}' > payload.json

          # Post payload (use --fail so non-2xx fails the job)
          curl --fail -sS -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json
